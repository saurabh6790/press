# Managed by Press — NATS server config for POS <-> HQ messaging
# Listens on the host private IP so benches can stream to it via nginx.
listen: {{ private_ip | default('127.0.0.1') }}:{{ nats_port | default(4222) }}

server_name: "{{ server }}"

{% if nats_seed | default('', true) | length > 0 %}
authorization {
    # Seed/nkey used to authenticate cloud (HQ) and POS connections.
    token: "{{ nats_seed }}"
}
{% endif %}

jetstream {
    store_dir: /etc/nats/jetstream
}
