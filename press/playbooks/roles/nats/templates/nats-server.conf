# Managed by Press — NATS server for POS <-> HQ messaging.
# Benches connect from inside their container using credentials minted from the
# operator/account/user trust chain provisioned by nsc (keystore: {{ nats_keystore_dir }}).
listen: {{ private_ip | default('127.0.0.1') }}:{{ nats_port | default(4222) }}

server_name: "{{ server }}"

jetstream {
    store_dir: /etc/nats/jetstream
}

# Operator JWT + account resolver, generated by `nsc generate config --mem-resolver`.
include resolver.conf
