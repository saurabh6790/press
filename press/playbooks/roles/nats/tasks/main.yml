---
- name: Create NATS Configuration Directory
  file:
    path: /etc/nats
    state: directory
    owner: frappe
    group: frappe
    mode: 0750

- name: Download NATS Server Binary (amd64)
  unarchive:
    src: "https://github.com/nats-io/nats-server/releases/download/v{{ nats_version }}/nats-server-v{{ nats_version }}-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: yes
    creates: "/tmp/nats-server-v{{ nats_version }}-linux-amd64"
  when: ansible_architecture == "x86_64"

- name: Download NATS Server Binary (arm64)
  unarchive:
    src: "https://github.com/nats-io/nats-server/releases/download/v{{ nats_version }}/nats-server-v{{ nats_version }}-linux-arm64.tar.gz"
    dest: /tmp
    remote_src: yes
    creates: "/tmp/nats-server-v{{ nats_version }}-linux-arm64"
  when: ansible_architecture == "aarch64"

- name: Install NATS Server Binary
  copy:
    src: "/tmp/nats-server-v{{ nats_version }}-linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}/nats-server"
    dest: /usr/local/bin/nats-server
    remote_src: yes
    owner: root
    group: root
    mode: 0755

- name: Install unzip (required to extract nsc)
  apt:
    name: unzip
    state: present

- name: Download and Install nsc (amd64)
  unarchive:
    src: "https://github.com/nats-io/nsc/releases/latest/download/nsc-linux-amd64.zip"
    dest: /usr/local/bin
    remote_src: yes
    creates: /usr/local/bin/nsc
    mode: 0755
  when: ansible_architecture == "x86_64"

- name: Download and Install nsc (arm64)
  unarchive:
    src: "https://github.com/nats-io/nsc/releases/latest/download/nsc-linux-arm64.zip"
    dest: /usr/local/bin
    remote_src: yes
    creates: /usr/local/bin/nsc
    mode: 0755
  when: ansible_architecture == "aarch64"

- name: Create NATS Keystore Directories
  file:
    path: "{{ item }}"
    state: directory
    owner: frappe
    group: frappe
    mode: 0750
  loop:
    - "{{ nats_keystore_dir }}"
    - "{{ nats_config_dir }}"

- name: Bootstrap NATS Operator, Account and User
  become: true
  become_user: frappe
  shell: |
    set -euo pipefail
    NSC="nsc --config-dir {{ nats_config_dir }} --data-dir {{ nats_keystore_dir }}/stores --keystore-dir {{ nats_keystore_dir }}/keys"
    $NSC add operator --name {{ nats_operator }} --sys --generate-signing-key
    $NSC edit operator --name {{ nats_operator }} --require-signing-keys \
      --account-jwt-server-url "nats://{{ private_ip | default('127.0.0.1') }}:{{ nats_port }}"
    $NSC add account --name {{ nats_account }}
    $NSC edit account --name {{ nats_account }} --js-mem-storage -1 --js-disk-storage -1
    $NSC add user --account {{ nats_account }} --name {{ nats_user }}
  args:
    executable: /bin/bash
    creates: "{{ nats_keystore_dir }}/stores/{{ nats_operator }}"

- name: Generate NATS Resolver Configuration
  become: true
  become_user: frappe
  shell: |
    set -euo pipefail
    nsc --config-dir {{ nats_config_dir }} --data-dir {{ nats_keystore_dir }}/stores \
      --keystore-dir {{ nats_keystore_dir }}/keys \
      generate config --mem-resolver --sys-account SYS --config-file /etc/nats/resolver.conf
  args:
    executable: /bin/bash
    creates: /etc/nats/resolver.conf

- name: Write NATS Server Configuration
  template:
    src: nats-server.conf
    dest: /etc/nats/nats-server.conf
    owner: frappe
    group: frappe
    mode: 0640
  no_log: true

- name: Create NATS Systemd Service File
  template:
    src: nats-server.service
    dest: /etc/systemd/system/nats-server.service
    owner: root
    group: root
    mode: 0644

- name: Start and Enable NATS Server Service
  systemd:
    daemon_reload: true
    name: nats-server
    enabled: yes
    state: restarted
